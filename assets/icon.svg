<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="128" cy="128" r="126" fill="#2C8DBF" opacity="0.1" stroke="#2C8DBF" stroke-width="2"/>
  
  <!-- Envelope Base -->
  <rect x="35" y="70" width="186" height="116" rx="6" fill="#2C8DBF" stroke="#1a4a5c" stroke-width="2"/>
  
  <!-- Envelope Flap -->
  <path d="M 35 70 L 128 130 L 221 70" fill="#3da5d9" stroke="#1a4a5c" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Envelope Content Line -->
  <line x1="35" y1="95" x2="221" y2="95" stroke="white" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Checkmark Circle -->
  <circle cx="180" cy="160" r="32" fill="#28a745" stroke="white" stroke-width="3"/>
  
  <!-- Checkmark -->
  <path d="M 172 160 L 178 168 L 192 150" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Sparkle 1 -->
  <circle cx="60" cy="45" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="68" cy="48" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="65" cy="38" r="2.5" fill="#FFD700" opacity="0.7"/>
  
  <!-- Sparkle 2 -->
  <circle cx="220" cy="55" r="3" fill="#FFD700" opacity="0.8"/>
  <circle cx="212" cy="52" r="2" fill="#FFD700" opacity="0.6"/>
  <circle cx="215" cy="65" r="2.5" fill="#FFD700" opacity="0.7"/>
  
  <!-- Email icon indicator -->
